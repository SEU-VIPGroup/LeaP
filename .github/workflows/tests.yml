name: CPU checks
on:
  push:
    branches: [main]
    paths: ['leap/**', 'scripts/**', 'tests/**', 'configs/**', 'third_party/*.json', 'CITATION.cff', 'MANIFEST.in', 'setup.py', 'requirements.txt', 'constraints-robotwin.txt', '.github/workflows/tests.yml']
  pull_request:
    paths: ['leap/**', 'scripts/**', 'tests/**', 'configs/**', 'third_party/*.json', 'CITATION.cff', 'MANIFEST.in', 'setup.py', 'requirements.txt', 'constraints-robotwin.txt', '.github/workflows/tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[robotwin]' -c constraints-robotwin.txt
      - name: Test policy and data pipeline
        run: python -m unittest discover -s tests -v
