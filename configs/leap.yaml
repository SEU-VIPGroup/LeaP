# Standalone training defaults for the RoboTwin joint-space main model.
policy:
  horizon: 8
  n_obs_steps: 3
  n_action_steps: 6
  encoder_output_dim: 128
  encoder_hidden_dims: [128, 128]
  use_pc_color: false
  nll_loss_weight: 1.0
  align_loss_weight: 0.3
  align_temperature: 0.1
  num_sampling_steps: 6
  flow_matcher_sigma: 0.0
  flow_net_hidden_dim: 512
  flow_net_num_layers: 4
  flow_net_mlp_ratio: 4.0
  flow_net_dropout: 0.0
  flow_net_time_embed_dim: 256
optimizer:
  lr: 0.0001
  betas: [0.95, 0.999]
  eps: 0.00000001
  weight_decay: 0.000001
training:
  epochs: 3001
  batch_size: 256
  warmup_steps: 500
  # Research train.py does not clip gradients, despite its unused config field.
  max_grad_norm: null
  checkpoint_every: 200
  val_ratio: 0.02
  val_every: 50
